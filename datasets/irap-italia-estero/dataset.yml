root: "../../out"
schema_version: 1

dataset:
  name: "irap_italia_estero"
  source_id: "mef_finanze"
  tags: [finanza-pubblica, irap, regionale, produzione-netta, estero]
  category: finanza-pubblica
  # years = anno di presentazione (URL MEF); la clean espone l'anno d'imposta
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage: {start_year: 2014, end_year: 2023}

raw:
  output_policy: overwrite
  sources:
    - name: "mef_irap_italia_estero"
      type: http_file
      args:
        url: "https://www1.finanze.gov.it/finanze/analisi_stat/public/index.php?tree={year}DIRTOT030001&export=3"
        filename: "irap_italia_estero_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, regione, cod_regione, contribuenti]
  # Lettura POSIZIONALE con tutte le colonne VARCHAR: i valori numerici sono in
  # formato italiano e vanno normalizzati dalle macro, che lavorano su stringhe.
  # Con `source: auto` lo sniffer tipizza DOUBLE le colonne i cui valori hanno un
  # solo punto e la macro le corrompe (×10/÷10): qui `vp_estero_freq` (max 1.088)
  # risultava DOUBLE in 2 anni su 10 → 40 celle sbagliate.
  read:
    source: config_only
    mode: latest
    header: false
    skip: 9
    delim: ";"
    encoding: "utf-8"
    columns:
      column00: "regione:VARCHAR"
      column01: "codice:VARCHAR"
      column02: "contribuenti:VARCHAR"
      column03: "prod_netta_frequenza:VARCHAR"
      column04: "prod_netta_ammontare:VARCHAR"
      column05: "prod_netta_media:VARCHAR"
      column06: "vp_estero_frequenza:VARCHAR"
      column07: "vp_estero_ammontare:VARCHAR"
      column08: "vp_estero_media:VARCHAR"
      column09: "vp_italia_frequenza:VARCHAR"
      column10: "vp_italia_ammontare:VARCHAR"
      column11: "vp_italia_media:VARCHAR"
      column12: "cella_finale:VARCHAR"
    normalize_rows_to_columns: true
    strict_mode: false
    ignore_errors: true
    null_padding: true
  validate:
    not_null: [anno, regione]
    min_rows: 20
    primary_key: [anno, regione]

mart:
  tables:
    - name: "mart_regioni_anno"
      sql: "sql/mart_regioni_anno.sql"
  required_tables:
    - "mart_regioni_anno"
  validate: {}

validation:
  fail_on_error: true
