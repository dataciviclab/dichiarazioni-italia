root: "../../out"
schema_version: 1

dataset:
  name: "irap_vp_regime"
  source_id: "mef_irap"
  tags: [finanza-pubblica, irap, regionale, valore-produzione]
  category: finanza-pubblica
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  output_policy: overwrite
  sources:
    - name: "mef_irap_vp_regime"
      type: http_file
      args:
        url: "https://www1.finanze.gov.it/finanze/analisi_stat/public/index.php?tree={year}DIRTOT020001&export=3"
        filename: "irap_vp_regime_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, regione, cod_regione, contribuenti]
  read:
    source: auto
    mode: latest
    skip: 9
    delim: ";"
    encoding: "latin-1"
    header: false
    columns:
      column00: "VARCHAR"
      column01: "VARCHAR"
      column02: "VARCHAR"
      column03: "VARCHAR"
      column04: "VARCHAR"
      column05: "VARCHAR"
      column06: "VARCHAR"
      column07: "VARCHAR"
      column08: "VARCHAR"
      column09: "VARCHAR"
      column10: "VARCHAR"
      column11: "VARCHAR"
      column12: "VARCHAR"
      column13: "VARCHAR"
      column14: "VARCHAR"
      column15: "VARCHAR"
      column16: "VARCHAR"
      column17: "VARCHAR"
      column18: "VARCHAR"
      column19: "VARCHAR"
      column20: "VARCHAR"
      column21: "VARCHAR"
      column22: "VARCHAR"
      column23: "VARCHAR"
      column24: "VARCHAR"
    normalize_rows_to_columns: true
    strict_mode: false
    ignore_errors: true
    null_padding: true
  validate:
    not_null: [anno, regione]
    min_rows: 20
    primary_key: [anno, regione]

mart:
  tables:
    - name: "mart_regioni_anno"
      sql: "sql/mart_regioni_anno.sql"
  required_tables:
    - "mart_regioni_anno"
  validate: {}

validation:
  fail_on_error: true
