root: "../../out"
schema_version: 1

dataset:
  name: "iva_sez_attivita"
  source_id: "mef_iva"
  tags: [finanza-pubblica, iva, settore, ateaco]
  category: finanza-pubblica
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

raw:
  output_policy: overwrite
  sources:
    - name: "mef_iva_sez_attivita"
      type: http_file
      args:
        url: "https://www1.finanze.gov.it/finanze/analisi_stat/public/index.php?tree={year}CIVATOT0202&export=3"
        filename: "iva_sez_attivita_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, sezione_attivita, codice, contribuenti]
  read:
    source: config_only
    mode: latest
    header: false
    skip: 9
    delim: ";"
    encoding: "utf-8"
    columns:
      column00: "VARCHAR"
      column01: "VARCHAR"
      column02: "VARCHAR"
      column03: "VARCHAR"
      column04: "VARCHAR"
      column05: "VARCHAR"
      column06: "VARCHAR"
      column07: "VARCHAR"
      column08: "VARCHAR"
      column09: "VARCHAR"
      column10: "VARCHAR"
      column11: "VARCHAR"
      column12: "VARCHAR"
      column13: "VARCHAR"
      column14: "VARCHAR"
      column15: "VARCHAR"
      column16: "VARCHAR"
      column17: "VARCHAR"
      column18: "VARCHAR"
      column19: "VARCHAR"
      column20: "VARCHAR"
      column21: "VARCHAR"
      column22: "VARCHAR"
      column23: "VARCHAR"
      column24: "VARCHAR"
      column25: "VARCHAR"
      column26: "VARCHAR"
      column27: "VARCHAR"
      column28: "VARCHAR"
      column29: "VARCHAR"
      column30: "VARCHAR"
      column31: "VARCHAR"
      column32: "VARCHAR"
      column33: "VARCHAR"
      column34: "VARCHAR"
      column35: "VARCHAR"
      column36: "VARCHAR"
      column37: "VARCHAR"
      column38: "VARCHAR"
      column39: "VARCHAR"
      column40: "VARCHAR"
    normalize_rows_to_columns: true
    strict_mode: false
    ignore_errors: true
    null_padding: true
  validate:
    not_null: [anno, sezione_attivita]
    min_rows: 20
    primary_key: [anno, sezione_attivita]

mart:
  tables:
    - name: "mart_settori_anno"
      sql: "sql/mart_settori_anno.sql"
  required_tables:
    - "mart_settori_anno"
  validate: {}

validation:
  fail_on_error: true
