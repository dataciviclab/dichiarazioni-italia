root: "../../out"
schema_version: 1

dataset:
  name: "irap_imposta_pa_regione"
  source_id: "mef_finanze"
  tags: [finanza-pubblica, irap, regionale, gettito, imposta, pubblica-amministrazione]
  category: finanza-pubblica
  description: "IRAP delle P.A.: base imponibile e imposta netta delle attività istituzionali per regione. Anno d'imposta 2014-2023."
  # years = anno di presentazione (URL MEF); la clean espone l'anno d'imposta
  # 2009-2014 disponibili ma con schema colonne diverso (v1: senza colonna Codice, latin-1)
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage: {start_year: 2014, end_year: 2023}

raw:
  output_policy: overwrite
  sources:
    # DIRTOT0501 = "Base imponibile ed imposta relativa alle attività istituzionali
    # esercitate dalle P.A." — header stabile 2015-2024, 21 colonne.
    # Con irap_imposta_regione (totale) la differenza dà il settore privato.
    - name: "mef_irap_imposta_pa_regione"
      type: http_file
      args:
        url: "https://www1.finanze.gov.it/finanze/analisi_stat/public/index.php?tree={year}DIRTOT0501&export=3"
        filename: "irap_imposta_pa_regione_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, regione, cod_regione, base_imponibile_frequenza, base_imponibile_eur, imposta_netta_frequenza, imposta_netta_eur, imposta_debito_eur, imposta_credito_eur]
  # Lettura POSIZIONALE con tutte le colonne VARCHAR: i valori numerici sono in
  # formato italiano ("1.234.567") e vanno normalizzati dalle macro, che
  # lavorano su stringhe. Con `source: auto` lo sniffer tipizza DOUBLE le
  # colonne con valori piccoli/ambigui (es. "132", "3.440") e le macro le
  # corrompono (×10 / ÷10). Il file ha una cella finale vuota e una riga-nota
  # finale; l'header è a riga 10 e viene letto come dato (skip: 9) e scartato
  # dal clean sul contenuto.
  read:
    source: config_only
    mode: latest
    header: false
    skip: 9
    delim: ";"
    encoding: "utf-8"
    columns:
      column00: "regione:VARCHAR"
      column01: "codice:VARCHAR"
      column02: "contribuenti:VARCHAR"
      column03: "base_imponibile_frequenza:VARCHAR"
      column04: "base_imponibile_ammontare:VARCHAR"
      column05: "base_imponibile_media:VARCHAR"
      column06: "imposta_netta_frequenza:VARCHAR"
      column07: "imposta_netta_ammontare:VARCHAR"
      column08: "imposta_netta_media:VARCHAR"
      column09: "eccedenze_frequenza:VARCHAR"
      column10: "eccedenze_ammontare:VARCHAR"
      column11: "eccedenze_media:VARCHAR"
      column12: "acconti_frequenza:VARCHAR"
      column13: "acconti_ammontare:VARCHAR"
      column14: "acconti_media:VARCHAR"
      column15: "imposta_debito_frequenza:VARCHAR"
      column16: "imposta_debito_ammontare:VARCHAR"
      column17: "imposta_debito_media:VARCHAR"
      column18: "imposta_credito_frequenza:VARCHAR"
      column19: "imposta_credito_ammontare:VARCHAR"
      column20: "imposta_credito_media:VARCHAR"
      # 22ª cella del file: sempre vuota (la riga termina con ";")
      column21: "cella_finale:VARCHAR"
    normalize_rows_to_columns: true
    strict_mode: false
    ignore_errors: true
    null_padding: true
  validate:
    not_null: [anno, regione]
    min_rows: 20
    primary_key: [anno, regione]

mart:
  tables:
    - name: "mart_regioni_anno"
      sql: "sql/mart_regioni_anno.sql"
    # Trend nazionale (multi-year): base, imposta, aliquota effettiva, delta
    - name: "mart_imposta_anno"
      sql: "sql/mart_imposta_anno.sql"
      years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  required_tables:
    - "mart_regioni_anno"
    - "mart_imposta_anno"
  validate:
    table_rules:
      mart_regioni_anno:
        required_columns: [anno, regione, cod_regione, base_imponibile_eur, imposta_netta_eur, imposta_debito_eur, imposta_credito_eur, aliquota_effettiva_pct, quota_base_pct, rank_imposta]
        primary_key: [anno, regione]
        min_rows: 20
      mart_imposta_anno:
        required_columns: [anno, base_imponibile_eur, imposta_netta_eur, aliquota_effettiva_pct]
        primary_key: [anno]
        min_rows: 10

validation:
  fail_on_error: true
