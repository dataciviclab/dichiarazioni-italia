root: "../../out"
schema_version: 1

dataset:
  name: "irap_imposta_pa_regione"
  source_id: "mef_finanze"
  tags: [finanza-pubblica, irap, regionale, gettito, imposta, pubblica-amministrazione]
  category: finanza-pubblica
  description: "IRAP delle P.A.: base imponibile e imposta netta delle attività istituzionali per regione. Anno d'imposta 2014-2023."
  # years = anno di presentazione (URL MEF); la clean espone l'anno d'imposta
  # 2009-2014 disponibili ma con schema colonne diverso (v1: senza colonna Codice, latin-1)
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage: {start_year: 2014, end_year: 2023}

raw:
  output_policy: overwrite
  sources:
    # DIRTOT0501 = "Base imponibile ed imposta relativa alle attività istituzionali
    # esercitate dalle P.A." — header stabile 2015-2024, 21 colonne.
    # Con irap_imposta_regione (totale) la differenza dà il settore privato.
    - name: "mef_irap_imposta_pa_regione"
      type: http_file
      args:
        url: "https://www1.finanze.gov.it/finanze/analisi_stat/public/index.php?tree={year}DIRTOT0501&export=3"
        filename: "irap_imposta_pa_regione_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, regione, cod_regione, base_imponibile_frequenza, base_imponibile_eur, imposta_netta_frequenza, imposta_netta_eur, imposta_debito_eur, imposta_credito_eur]
  read:
    source: auto
    mode: latest
    skip: 9
    delim: ";"
    encoding: "utf-8"
    header: true
    strict_mode: false
    ignore_errors: true
    null_padding: true
  validate:
    not_null: [anno, regione]
    min_rows: 20
    primary_key: [anno, regione]

mart:
  tables:
    - name: "mart_regioni_anno"
      sql: "sql/mart_regioni_anno.sql"
    # Trend nazionale (multi-year): base, imposta, aliquota effettiva, delta
    - name: "mart_imposta_anno"
      sql: "sql/mart_imposta_anno.sql"
      years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  required_tables:
    - "mart_regioni_anno"
    - "mart_imposta_anno"
  validate:
    table_rules:
      mart_regioni_anno:
        required_columns: [anno, regione, cod_regione, base_imponibile_eur, imposta_netta_eur, imposta_debito_eur, imposta_credito_eur, aliquota_effettiva_pct, quota_base_pct, rank_imposta]
        primary_key: [anno, regione]
        min_rows: 20
      mart_imposta_anno:
        required_columns: [anno, base_imponibile_eur, imposta_netta_eur, aliquota_effettiva_pct]
        primary_key: [anno]
        min_rows: 10

validation:
  fail_on_error: true
