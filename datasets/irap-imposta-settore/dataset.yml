root: "../../out"
schema_version: 1

dataset:
  name: "irap_imposta_settore"
  source_id: "mef_finanze"
  tags: [finanza-pubblica, irap, settore, ateaco, gettito, imposta]
  category: finanza-pubblica
  description: "IRAP: base imponibile e totale imposta per sezione di attività (ATECO). Anno d'imposta 2014-2023."
  # years = anno di presentazione (URL MEF); la clean espone l'anno d'imposta
  # 2009-2014 disponibili ma con schema colonne diverso (v1: senza colonna Codice, latin-1)
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage: {start_year: 2014, end_year: 2023}

raw:
  output_policy: overwrite
  sources:
    # DIRTOT1002 = "Base imponibile ed imposta totale - Sezione di attività".
    # Letto per POSIZIONE: il file ha nomi di sezione con ';' NON quotato
    # (es. "Fornitura di acqua; reti fognarie…"), che sposta di una cella le
    # righe interessate → la clean ripara lo shift (vedi sql/clean.sql).
    - name: "mef_irap_imposta_settore"
      type: http_file
      args:
        url: "https://www1.finanze.gov.it/finanze/analisi_stat/public/index.php?tree={year}DIRTOT1002&export=3"
        filename: "irap_imposta_settore_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, sezione_attivita, codice, contribuenti, base_imponibile_frequenza, base_imponibile_eur, imposta_frequenza, imposta_eur]
  read:
    source: config_only
    mode: latest
    header: false
    skip: 9
    delim: ";"
    encoding: "utf-8"
    columns:
      column00: "VARCHAR"
      column01: "VARCHAR"
      column02: "VARCHAR"
      column03: "VARCHAR"
      column04: "VARCHAR"
      column05: "VARCHAR"
      column06: "VARCHAR"
      column07: "VARCHAR"
      column08: "VARCHAR"
      column09: "VARCHAR"
      column10: "VARCHAR"
    normalize_rows_to_columns: true
    strict_mode: false
    ignore_errors: true
    null_padding: true
  validate:
    not_null: [anno, sezione_attivita]
    min_rows: 20
    primary_key: [anno, sezione_attivita]

mart:
  tables:
    - name: "mart_settori_anno"
      sql: "sql/mart_settori_anno.sql"
    # Trend nazionale (multi-year): base, imposta, aliquota effettiva, delta
    - name: "mart_imposta_anno"
      sql: "sql/mart_imposta_anno.sql"
      years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  required_tables:
    - "mart_settori_anno"
    - "mart_imposta_anno"
  validate:
    table_rules:
      mart_settori_anno:
        required_columns: [anno, sezione_attivita, codice, base_imponibile_eur, imposta_eur, aliquota_effettiva_pct, quota_base_pct, rank_imposta]
        primary_key: [anno, sezione_attivita]
        min_rows: 20
      mart_imposta_anno:
        required_columns: [anno, base_imponibile_eur, imposta_eur, aliquota_effettiva_pct]
        primary_key: [anno]
        min_rows: 10

validation:
  fail_on_error: true
